services:
  cc-remote:
    build: .
    image: cc-remote:latest
    container_name: cc-remote
    restart: unless-stopped
    ports:
      - "${CC_REMOTE_BIND:-127.0.0.1}:${CC_REMOTE_PORT:-61777}:61777"
    environment:
      CC_REMOTE_PORT: "61777"
      CC_REMOTE_HOST: "0.0.0.0"
      CLAUDE_CONFIG_DIR: /home/node/.claude
      CC_REMOTE_TOKEN: "${CC_REMOTE_TOKEN:?set CC_REMOTE_TOKEN in .env}"
      CC_REMOTE_ROOTS: "${CC_REMOTE_WORKSPACE}"
    volumes:
      - "${CC_REMOTE_CLAUDE_DIR}:/home/node/.claude"
      - "${CC_REMOTE_DATA_DIR}:/home/node/.cc-remote"
      - "${CC_REMOTE_WORKSPACE}:${CC_REMOTE_WORKSPACE}"
