<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, interactive-widget=resizes-content">
<title>Claude Remote</title>

<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141417">
<meta name="description" content="Drive Claude Code from your phone over Tailscale.">

<link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="/icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Claude">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<script>
(function () {
  var d = document.documentElement;
  try {
    var t = localStorage.getItem("cr_theme");
    if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    d.dataset.theme = t;
    var f = localStorage.getItem("cr_fs");
    if (f) d.style.setProperty("--fs", f + "px");
    var i = localStorage.getItem("cr_inset");
    if (i) d.style.setProperty("--extra-b", i + "px");
  } catch (e) { d.dataset.theme = "light"; }
})();
</script>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app" role="application" aria-label="Claude Remote"></div>
<div id="toasts" aria-live="polite" aria-atomic="true"></div>
</body>
<script type="module" src="/app.js"></script>
</html>
