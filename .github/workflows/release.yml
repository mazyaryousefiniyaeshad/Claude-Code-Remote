name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: ./scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: server
          path: dist/cc-remote.tgz

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build the web app
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npx cap sync android
      - name: Set the version
        working-directory: app/android/app
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"[^\"]*\"/versionName \"${GITHUB_REF_NAME#v}\"/" build.gradle
      - name: Build the APK
        working-directory: app/android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ -n "$KEYSTORE" ]; then
            ./gradlew assembleRelease --no-daemon -q
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
            "$tools/zipalign" -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" --key-pass env:KEYSTORE_PASSWORD --out cc-remote.apk "$RUNNER_TEMP/aligned.apk"
          else
            ./gradlew assembleDebug --no-daemon -q
            cp app/build/outputs/apk/debug/app-debug.apk cc-remote.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: app/android/cc-remote.apk

  release:
    needs: [package, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" cc-remote.tgz cc-remote.apk \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
