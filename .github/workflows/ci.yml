name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm ci
        working-directory: app
      - run: npm run lint
        working-directory: app
      - run: npm run build
        working-directory: app

  install:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Package
        shell: bash
        run: ./scripts/package.sh
      - name: Install on macOS and Linux
        if: runner.os != 'Windows'
        env:
          CC_REMOTE_SOURCE: ${{ github.workspace }}/dist/cc-remote.tgz
        run: sh ./install.sh --network --yes
      - name: Install on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CC_REMOTE_SOURCE: ${{ github.workspace }}\dist\cc-remote.tgz
        run: ./install.ps1 --network --yes
      - name: Check that it answers
        shell: bash
        run: |
          cli="$HOME/.local/bin/cc-remote"
          data="$HOME/.cc-remote"
          if [ "$RUNNER_OS" = Windows ]; then
            data="$(cygpath "$USERPROFILE")/.cc-remote"
            cli="$data/bin/cc-remote.cmd"
          fi
          report() {
            { "$cli" status; echo "--- server.log"; tail -n 40 "$data/logs/server.log"; } > report.txt 2>&1 || true
            echo "::error title=Diagnostics::$(awk '{printf "%s%%0A", $0}' report.txt)"
          }
          trap report ERR
          set -e
          if "$cli" status > before.txt 2>&1; then state=running; else state=stopped; fi
          echo "::notice title=After install::the server was $state when this step began"
          "$cli" start
          "$cli" status
          token=$("$cli" token | tr -d '\r')
          curl -fsS -H "Authorization: Bearer $token" http://127.0.0.1:61777/api/health
          curl -fsS -o /dev/null http://127.0.0.1:61777/
          "$cli" uninstall --purge
